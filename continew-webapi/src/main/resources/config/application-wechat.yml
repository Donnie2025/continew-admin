# 微信支付和公众号配置
wechat:
  # 微信支付配置
  pay:
    # 商户号（示例：1234567890）
    mch-id: ${WECHAT_MCH_ID:1745459148}
    # 商户API密钥（APIv3密钥，32位字符串）
    api-v3-key: ${WECHAT_API_V3_KEY:ca689933f1894504a16b138418e6db65}
    # 商户证书序列号（在商户平台-API安全中查看）
    merchant-serial-number: ${WECHAT_MERCHANT_SERIAL_NUMBER:46FE4DCB3519C210AE29C46F5F3854066F939C99}
    # 商户私钥路径（相对于classpath，证书文件在 continew-webapi/resources/cert/ 目录）
    private-key-path: ${WECHAT_PRIVATE_KEY_PATH:classpath:cert/apiclient_key.pem}
    # 微信支付公钥路径
    public-key-path: ${WECHAT_PUBLIC_KEY_PATH:classpath:cert/pub_key.pem}
    # 微信支付公钥ID
    public-key-id: ${WECHAT_PUBLIC_KEY_ID:PUB_KEY_ID_0117454591482026060500291682001003}
    # 支付回调通知地址（必须是公网HTTPS地址）
    notify-url: ${WECHAT_NOTIFY_URL:https://student.haoyueke.com.cn/api/payment/wechat/notify}

  # 微信公众号配置（用于获取用户openid）
  mp:
    # 公众号AppId
    app-id: ${WECHAT_MP_APP_ID:wx7225583c047bef96}
    # 公众号AppSecret
    secret: ${WECHAT_MP_SECRET:2184f965da2dc29b35cc536647b94640}
    # OAuth2授权回调地址
    oauth-redirect-url: ${WECHAT_OAUTH_REDIRECT_URL:https://student.haoyueke.com.cn/api/wechat/oauth/callback}

# 使用说明：
# 1. 将商户证书文件（apiclient_key.pem）放到 src/main/resources/cert/ 目录下
# 2. 在生产环境建议使用环境变量配置敏感信息，而不是直接写在配置文件中
# 3. 示例环境变量配置：
#    export WECHAT_MCH_ID=1234567890
#    export WECHAT_API_V3_KEY=your-api-v3-key-32-chars-long
#    export WECHAT_MERCHANT_SERIAL_NUMBER=ABCDEF1234567890
#    export WECHAT_NOTIFY_URL=https://yourdomain.com/api/payment/wechat/notify
#    export WECHAT_MP_APP_ID=wx1234567890abcdef
#    export WECHAT_MP_SECRET=your-mp-secret-32-chars-long
